<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support &mdash; Sarge Lookup</title>
<meta name="description" content="Sarge Lookup support contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#111;--blue:#1c9fe0;--paper:#fff;--mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;--serif:"Playfair Display",Georgia,"Times New Roman",serif;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--mono);line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:60px 36px 100px;}
  .wordmark{font-family:var(--serif);font-weight:700;font-size:clamp(30px,6vw,44px);margin-bottom:6px;}
  .rule{border:0;border-top:5px solid var(--ink);margin:16px 0 36px;}
  main p{margin:0 0 22px;max-width:60ch;}
  .email{font-family:var(--mono);font-size:18px;font-weight:700;}
  .email a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--blue);}
  .email a:hover{color:var(--blue);}
  .backlink{margin-top:44px;font-size:14px;}
  .backlink a{color:#777;text-decoration:none;} .backlink a:hover{color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">Support</div>
  <hr class="rule">
  <main>
    <p>Questions, bugs, or feedback about Sarge Lookup? Email us:</p>
    <p class="email"><a href="mailto:sarge-support@rookdynamics.com">sarge-support@rookdynamics.com</a></p>
    <p>We're a small team and can't guarantee a response time, but we read every message. We appreciate the feedback &mdash; it directly shapes what we build next.</p>
  </main>
  <div class="backlink"><a href="../">&larr; Sarge Lookup</a></div>
</div>
</body>
</html>
