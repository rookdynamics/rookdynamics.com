<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support &mdash; Sarge Lookup</title>
<meta name="description" content="Sarge Lookup support contact.">
<link rel="icon" href="../assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1220; --surface:#101d34; --surface-2:#16243f;
    --border:rgba(143,168,217,0.22); --border-soft:rgba(143,168,217,0.12);
    --text:#f5f7fa; --text-dim:#a9b8d1;
    --accent:#8fa8d9;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --display:"Space Grotesk",var(--sans);
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(circle at 15% -10%, #16264a 0%, var(--bg) 55%);
    color:var(--text); font-family:var(--sans); line-height:1.65;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;min-height:100%;
  }
  .wrap{max-width:520px;margin:0 auto;padding:60px 24px;width:100%;}
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:40px 32px;text-align:center;
  }
  .card img{width:72px;height:72px;border-radius:18px;margin-bottom:22px;box-shadow:0 0 0 1px var(--border);}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,30px);letter-spacing:-0.01em;margin:0 0 14px;}
  p{font-size:15.5px;color:var(--text-dim);margin:0 0 22px;}
  .email-btn{
    display:inline-block;font-family:var(--display);font-weight:700;font-size:15.5px;
    color:var(--bg);background:var(--accent);padding:14px 24px;border-radius:12px;
    text-decoration:none;word-break:break-all;transition:background .15s ease, transform .15s ease;
  }
  .email-btn:hover{background:var(--text);transform:translateY(-1px);}
  .fine{font-size:13.5px;color:var(--text-dim);margin-top:24px;margin-bottom:0;}
  .backlink{display:block;margin-top:30px;font-size:14px;color:var(--text-dim);text-decoration:none;}
  .backlink:hover{color:var(--accent);}
  @media (max-width:480px){
    .wrap{padding:36px 16px;}
    .card{padding:32px 20px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img src="../assets/icon.png" alt="Sarge Lookup app icon">
    <h1>Support</h1>
    <p>Questions, bugs, or feedback about Sarge Lookup? Email us:</p>
    <a class="email-btn" href="mailto:sarge-support@rookdynamics.com">sarge-support@rookdynamics.com</a>
    <p class="fine">We're a small team and can't guarantee a response time, but we read every message. We appreciate the feedback &mdash; it directly shapes what we build next.</p>
  </div>
  <a class="backlink" href="../">&larr; Sarge Lookup</a>
</div>
</body>
</html>
