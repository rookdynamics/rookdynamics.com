<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &mdash; Rook Dynamics</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function(){var t=null;try{t=localStorage.getItem('rd-theme');}catch(e){}if(t!=='dark'&&t!=='light'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<style>
  :root{color-scheme:light;--ink:#111214;--ink-2:#44474d;--line:#e4e6ea;--bg:#f6f7f9;--card:#ffffff;--on-ink:#ffffff;--btn-hover:#000000}
  html[data-theme="dark"]{color-scheme:dark;--ink:#ececee;--ink-2:#b4b7be;--line:#2c2e33;--bg:#121316;--card:#1c1d21;--on-ink:#121316;--btn-hover:#ffffff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:48px 40px;max-width:520px;width:100%;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
  .logo{display:block;width:150px;height:auto;margin:0 auto 28px}
  .logo-dark{display:none}
  html[data-theme="dark"] .logo-light{display:none}
  html[data-theme="dark"] .logo-dark{display:block}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:clamp(36px,6vw,52px);line-height:1.05;letter-spacing:-.01em;margin:0 0 12px}
  p{color:var(--ink-2);margin:0 0 28px}
  a.btn{display:inline-block;padding:12px 20px;border-radius:9px;background:var(--ink);color:var(--on-ink);text-decoration:none;font-weight:600;font-size:14px}
  a.btn:hover{background:var(--btn-hover)}
</style>
</head>
<body>
  <main class="card">
    <img class="logo logo-light" src="/assets/rooklogo_black.png" alt="Rook Dynamics" width="1678" height="594">
    <img class="logo logo-dark" src="/assets/rooklogo_white.png" alt="Rook Dynamics" width="1678" height="594">
    <h1>Page not found</h1>
    <p>That address doesn't exist on this site. The link may be out of date.</p>
    <a class="btn" href="/">Back to the home page</a>
  </main>
</body>
</html>
